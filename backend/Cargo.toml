[package]
name = "sepia-gateway"
version = "0.1.13"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
async-stream = "0.3"
arc-swap = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
http = "1"
ipnet = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }
thiserror = "2"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs-core = "0.6.2"
zeroize = "1"
wasmtime = "29"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
p256 = { version = "0.14", features = ["ecdsa"] }
serde_cbor_2 = "0.13"
